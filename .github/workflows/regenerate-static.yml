name: Regenerate static dish pages

on:
  schedule:
    - cron: '0 1 * * *'  # daily at 01:00 UTC = 09:00 SGT
  workflow_dispatch:       # also triggerable manually from the GitHub Actions tab

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push the commit back to main

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate static pages
        run: python scripts/generate-static.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dishes/ sitemap.xml
          git diff --staged --quiet && echo "Nothing changed, skipping commit." || (
            git commit -m "chore: regenerate static pages $(date -u +%Y-%m-%d)" &&
            git push
          )
