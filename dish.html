<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Singapore Food — Voted by Community</title>
<meta name="description" content="Community-voted top 10 Singapore hawker restaurants. See real-time rankings and cast your vote.">
<link rel="canonical" id="meta-canonical" href="https://top10singaporefood.com/dish.html">
<meta property="og:title" id="meta-og-title" content="Top 10 Singapore Food Voted by Community">
<meta property="og:description" id="meta-og-desc" content="Community-voted top 10 Singapore hawker restaurants. See real-time rankings and cast your vote.">
<meta property="og:url" id="meta-og-url" content="https://top10singaporefood.com/dish.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Top 10 Singapore Food">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" id="meta-tw-title" content="Top 10 Singapore Food Voted by Community">
<meta name="twitter:description" id="meta-tw-desc" content="Community-voted top 10 Singapore hawker restaurants. See real-time rankings and cast your vote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C0392B;
    --red-light: #fdf0ef;
    --gold: #B8860B;
    --silver: #7a7a7a;
    --bronze: #8B4513;
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4de;
    --text: #1a1a1a;
    --muted: #6b6660;
    --hint: #a09a94;
    --info-bg: #eef4fb;
    --info: #1a4f8a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--red);
    color: white;
    padding: 0 24px;
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 56px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .back-link {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
  }

  .back-link:hover { color: white; }

  header h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(14px, 3.2vw, 20px);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 90px;
  }

  .votes-bubble {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--info);
    color: white;
    padding: 10px 10px 10px 20px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 16px rgba(26,79,138,0.35);
    z-index: 90;
    white-space: nowrap;
    transition: opacity 0.3s;
  }

  .votes-bubble .pips { display: flex; gap: 3px; }

  .pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.2s;
  }

  .pip.used { background: white; }

  .submit-btn {
    background: white;
    color: var(--info);
    border: none;
    padding: 6px 16px;
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    touch-action: manipulation;
  }

  .submit-btn:hover:not(:disabled) { background: #e8f0fe; }
  .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }

  thead th {
    font-size: 10px;
    font-weight: 500;
    color: var(--hint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    background: #faf9f7;
  }

  thead th.r { text-align: right; }
  thead th.c { text-align: center; }
  thead th.count-cell { font-size: 10px; color: var(--hint); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf9f7; }

  td { padding: 12px 14px; vertical-align: middle; }

  .rank-cell {
    font-size: 14px;
    font-weight: 500;
    color: var(--hint);
    width: 32px;
    text-align: center;
  }

  .rank-cell.gold { color: var(--gold); }
  .rank-cell.silver { color: var(--silver); }
  .rank-cell.bronze { color: var(--bronze); }

  .rest-cell {
    overflow: hidden;
  }

  .rest-cell .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rest-cell .addr {
    font-size: 12px;
    color: var(--hint);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .count-cell {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    width: 70px;
  }

  .vote-cell { text-align: right; width: 72px; }

  .vctrl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .vbtn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    font-family: 'DM Sans', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .vbtn:hover:not(:disabled) {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
  }

  .vbtn:disabled { opacity: 0.35; cursor: not-allowed; }

  .vnum {
    font-size: 12px;
    font-weight: 500;
    min-width: 16px;
    text-align: center;
    color: var(--text);
  }

  .vnum.active { color: var(--red); }

  .voted-row td { background: #fefaf9; }

  .voted-badge {
    font-size: 11px;
    background: var(--red-light);
    color: var(--red);
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid #f0c8c4;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--hint);
  }

  .empty-state h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 8px;
    color: var(--muted);
  }

  .empty-state p { font-size: 13px; line-height: 1.6; }

  .search-wrap {
    margin-bottom: 12px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--hint);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .search-input::placeholder { color: var(--hint); }

  .search-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--hint);
    margin-top: 20px;
  }

  .loading-row td {
    text-align: center;
    padding: 40px;
    color: var(--hint);
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: white;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 14px;
    transition: transform 0.3s ease;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .votes-bubble { font-size: 13px; padding: 8px 8px 8px 16px; bottom: 16px; }
    .votes-bubble .pips { display: none; }
    .submit-btn { padding: 6px 14px; font-size: 12px; }

    header { padding: 0 16px; }
    header h1 { font-size: clamp(12px, 3.5vw, 16px); }

    td { padding: 10px 6px; }
    thead th { padding: 10px 6px; }

    .vbtn { width: 34px; height: 34px; font-size: 17px; }
    .vnum { font-size: 13px; min-width: 18px; }
    .vote-cell { width: auto; }
  }

  .google-btn {
    background: white;
    color: #3c4043;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
  }

  .google-btn:hover { background: #f1f3f4; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

  .auth-user {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(255,255,255,0.9);
  }

  .signout-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 4px 12px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
    touch-action: manipulation;
  }

  .signout-btn:hover { background: rgba(255,255,255,0.3); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <a class="back-link" href="index.html">←</a>
      <h1 id="page-title">Loading…</h1>
    </div>
    <div class="auth-bar" id="auth-bar">
      <button class="google-btn" onclick="signIn()">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google to vote
      </button>
    </div>
  </div>
</header>

<div class="container">

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="search-input" type="search" placeholder="Search restaurants…" oninput="onSearch(this.value)">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Restaurant</th>
          <th class="r count-cell">Total Votes</th>
          <th class="r">Your vote</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="loading-row"><td colspan="3">Loading restaurants…</td></tr>
      </tbody>
    </table>
  </div>

  <p class="footer-note" id="footer-note"></p>
</div>

<div class="votes-bubble" id="votes-bubble">
  <span>You have <strong id="votes-left">10</strong> votes left</span>
  <div class="pips" id="pips-container"></div>
  <button class="submit-btn" id="submit-btn" onclick="commitVotes()" disabled>Save</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://xlbgijjtxbflhkjftene.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1tTdNWd1N0n9w3ElrCynNw_ia1JWbc6';
  const TOTAL_VOTES = 10;

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let slug = '';
  let categoryName = '';
  let categoryId = null;
  let restaurants = [];
  let myVotes = {};
  let savedVotes = {};
  let searchQuery = '';

  // ── auth ──
  sb.auth.onAuthStateChange(async (event, session) => {
    currentUser = session?.user || null;
    if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
    renderAuthBar();
    if (currentUser) {
      savedVotes = await fetchMyVotes();
      myVotes = { ...savedVotes };
    } else {
      savedVotes = {};
      myVotes = {};
    }
    if (restaurants.length) renderTable();
  });

  function renderAuthBar() {
    const bar = document.getElementById('auth-bar');
    if (currentUser) {
      bar.innerHTML = `<button class="signout-btn" onclick="signOut()">Sign out</button>`;
    } else {
      bar.innerHTML = `<button class="google-btn" onclick="signIn()"><svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Sign in with Google to vote</button>`;
    }
  }

  async function signIn() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname, scopes: 'email' }
    });
    if (error) showToast('Sign in failed: ' + error.message);
  }

  function signOut() {
    myVotes = {};
    currentUser = null;
    try { localStorage.removeItem('sb-xlbgijjtxbflhkjftene-auth-token'); } catch {}
    sb.auth.signOut({ scope: 'local' }).catch(() => {});
    renderAuthBar();
    renderTable();
  }

  function getAuthToken() {
    try {
      const stored = localStorage.getItem('sb-xlbgijjtxbflhkjftene-auth-token');
      return stored ? JSON.parse(stored)?.access_token ?? null : null;
    } catch { return null; }
  }

  function authHeaders() {
    const token = getAuthToken();
    return token ? { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' } : null;
  }

  async function fetchMyVotes() {
    if (!categoryId) return {};
    const headers = authHeaders();
    if (!headers) return {};
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/votes?select=target_id,votes_given&user_id=eq.${currentUser.id}&target_type=eq.restaurant`,
        { headers }
      );
      if (!res.ok) return {};
      const data = await res.json();
      const map = {};
      data.forEach(r => { map[r.target_id] = r.votes_given; });
      return map;
    } catch { return {}; }
  }

  function votesUsed() { return Object.values(myVotes).reduce((a, b) => a + b, 0); }
  function votesRemaining() { return TOTAL_VOTES - votesUsed(); }

  // ── init ──
  async function init() {
    const params = new URLSearchParams(window.location.search);
    slug = params.get('slug');

    renderAuthBar();

    if (!slug) {
      document.getElementById('page-title').textContent = 'Dish not found';
      document.getElementById('table-body').innerHTML =
        '<tr class="loading-row"><td colspan="3">No dish specified.</td></tr>';
      return;
    }

    try {
      const dishRes = await fetch(
        `${SUPABASE_URL}/rest/v1/dishes?slug=eq.${encodeURIComponent(slug)}`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      const cats = dishRes.ok ? await dishRes.json() : [];
      if (!cats.length) {
        document.getElementById('page-title').textContent = 'Dish not found';
        return;
      }
      const cat = cats[0];
      categoryId = cat.id;
      categoryName = cat.name;
      document.title = `Top 10 ${cat.name} in Singapore — Voted by Community`;
      document.getElementById('page-title').textContent = `Top 10 ${cat.name} Voted by Community`;
      updateMeta(cat.name, slug);

      await loadRestaurants();
    } catch (e) {
      document.getElementById('page-title').textContent = 'Could not load';
      document.getElementById('table-body').innerHTML =
        '<tr class="loading-row"><td colspan="3">Error loading data. Check console.</td></tr>';
    }
  }

  async function loadRestaurants() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/restaurants_with_votes?category_id=eq.${categoryId}&order=total_votes.desc`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      restaurants = res.ok ? await res.json() : [];
    } catch { restaurants = []; }
    if (currentUser) {
      savedVotes = await fetchMyVotes();
      myVotes = { ...savedVotes };
    }
    if (categoryName && restaurants.length) injectSchema(categoryName, slug, restaurants);
    renderTable();
  }

  function onSearch(val) {
    searchQuery = val.trim().toLowerCase();
    renderTable();
  }

  function hasChanges() {
    const allIds = new Set([...Object.keys(myVotes), ...Object.keys(savedVotes)].map(Number));
    for (const id of allIds) {
      if ((myVotes[id] || 0) !== (savedVotes[id] || 0)) return true;
    }
    return false;
  }

  function renderTable() {
    const remaining = votesRemaining();
    const used = votesUsed();

    document.getElementById('votes-left').textContent = remaining;
    renderPips(used);

    const btn = document.getElementById('submit-btn');
    const changed = hasChanges();
    btn.disabled = !changed;
    btn.textContent = changed ? `Save (${used})` : (used > 0 ? 'Saved' : 'Save');

    const tbody = document.getElementById('table-body');

    if (!restaurants.length) {
      tbody.innerHTML = `
        <tr><td colspan="3">
          <div class="empty-state">
            <h3>No restaurants yet</h3>
            <p>Add restaurants for this dish in your Supabase dashboard.<br>
            Go to Table Editor → restaurants → Insert row.</p>
          </div>
        </td></tr>`;
      document.getElementById('footer-note').textContent = '';
      return;
    }

    const filtered = searchQuery
      ? restaurants.filter(r => r.name.toLowerCase().includes(searchQuery) || (r.address || '').toLowerCase().includes(searchQuery))
      : restaurants;

    if (!filtered.length) {
      tbody.innerHTML = `<tr class="loading-row"><td colspan="3">No restaurants match "${document.getElementById('search-input').value}".</td></tr>`;
      document.getElementById('footer-note').textContent = '';
      return;
    }

    tbody.innerHTML = filtered.map((r) => {
      const myV = myVotes[r.id] || 0;
      const isVoted = myV > 0;
      const minusDisabled = !currentUser || myV <= 0;
      const plusDisabled = !currentUser || remaining <= 0;

      return `<tr class="${isVoted ? 'voted-row' : ''}" id="row-${r.id}">
        <td class="rest-cell">
          <div class="name">${r.name}</div>
          ${r.address ? `<div class="addr">${r.address}</div>` : ''}
        </td>
        <td class="count-cell">${(r.total_votes || 0).toLocaleString()}</td>
        <td class="vote-cell">
          <div class="vctrl">
            <button class="vbtn" onclick="changeVote(${r.id}, -1)" ${minusDisabled ? 'disabled' : ''}>−</button>
            <span class="vnum ${myV > 0 ? 'active' : ''}" id="vnum-${r.id}">${myV}</span>
            <button class="vbtn" onclick="changeVote(${r.id}, 1)" ${plusDisabled ? 'disabled' : ''}>+</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    const note = searchQuery
      ? `${filtered.length} of ${restaurants.length} restaurants`
      : `${restaurants.length} restaurant${restaurants.length !== 1 ? 's' : ''} · sorted by community votes`;
    document.getElementById('footer-note').textContent = note;
  }

  function renderPips(used) {
    const container = document.getElementById('pips-container');
    container.innerHTML = Array.from({ length: TOTAL_VOTES }, (_, i) =>
      `<div class="pip ${i < used ? 'used' : ''}"></div>`
    ).join('');
  }

  function changeVote(restId, delta) {
    if (!currentUser) { showToast('Please sign in to vote'); return; }

    const current = myVotes[restId] || 0;
    if (delta < 0 && current <= 0) return;
    if (delta > 0 && votesRemaining() <= 0) return;

    const newVal = current + delta;
    if (newVal <= 0) delete myVotes[restId];
    else myVotes[restId] = newVal;

    renderTable();
  }

  async function commitVotes() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const headers = authHeaders();
      if (!headers) throw new Error('not authenticated');
      const allIds = new Set([...Object.keys(myVotes), ...Object.keys(savedVotes)].map(Number));
      for (const restId of allIds) {
        const newVal = myVotes[restId] || 0;
        const oldVal = savedVotes[restId] || 0;
        if (newVal === oldVal) continue;
        if (newVal > 0) {
          const ups = await fetch(`${SUPABASE_URL}/rest/v1/votes?on_conflict=user_id,target_type,target_id`,
            { method: 'POST', headers: { ...headers, Prefer: 'resolution=merge-duplicates,return=minimal' },
              body: JSON.stringify({ user_id: currentUser.id, target_type: 'restaurant', target_id: restId, votes_given: newVal }) });
          if (!ups.ok) throw new Error('upsert failed');
        } else {
          const del = await fetch(`${SUPABASE_URL}/rest/v1/votes?user_id=eq.${currentUser.id}&target_type=eq.restaurant&target_id=eq.${restId}`,
            { method: 'DELETE', headers });
          if (!del.ok) throw new Error('delete failed');
        }
      }
      savedVotes = { ...myVotes };
      showToast('Votes saved!');
      await loadRestaurants();
    } catch (e) {
      showToast('Error saving votes. Please try again.');
    }
    renderTable();
  }

  function updateMeta(catName, catSlug) {
    const desc = `Community-voted top 10 ${catName} restaurants in Singapore. See real-time rankings and cast your vote.`;
    const url = `https://top10singaporefood.com/dish.html?slug=${catSlug}`;
    const title = `Top 10 ${catName} in Singapore — Voted by Community`;
    document.querySelector('meta[name="description"]').setAttribute('content', desc);
    document.getElementById('meta-canonical').setAttribute('href', url);
    document.getElementById('meta-og-title').setAttribute('content', title);
    document.getElementById('meta-og-desc').setAttribute('content', desc);
    document.getElementById('meta-og-url').setAttribute('content', url);
    document.getElementById('meta-tw-title').setAttribute('content', title);
    document.getElementById('meta-tw-desc').setAttribute('content', desc);
  }

  function injectSchema(catName, catSlug, rests) {
    const el = document.getElementById('ld-json-dish');
    if (el) el.remove();
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.id = 'ld-json-dish';
    s.textContent = JSON.stringify([
      {
        '@context': 'https://schema.org',
        '@type': 'BreadcrumbList',
        'itemListElement': [
          { '@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': 'https://top10singaporefood.com/' },
          { '@type': 'ListItem', 'position': 2, 'name': `Top 10 ${catName}`, 'item': `https://top10singaporefood.com/dish.html?slug=${catSlug}` }
        ]
      },
      {
        '@context': 'https://schema.org',
        '@type': 'ItemList',
        'name': `Top 10 ${catName} Restaurants in Singapore`,
        'description': `Community-voted ranking of the best ${catName} restaurants in Singapore`,
        'url': `https://top10singaporefood.com/dish.html?slug=${catSlug}`,
        'itemListElement': rests.map((r, i) => ({
          '@type': 'ListItem',
          'position': i + 1,
          'item': {
            '@type': 'Restaurant',
            'name': r.name,
            'servesCuisine': catName,
            'address': {
              '@type': 'PostalAddress',
              'streetAddress': r.address || '',
              'addressCountry': 'SG'
            }
          }
        }))
      }
    ]);
    document.head.appendChild(s);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  init();
</script>
</body>
</html>
