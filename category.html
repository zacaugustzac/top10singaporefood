<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 — Singapore Food Voted by Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C0392B;
    --red-light: #fdf0ef;
    --gold: #B8860B;
    --silver: #7a7a7a;
    --bronze: #8B4513;
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4de;
    --text: #1a1a1a;
    --muted: #6b6660;
    --hint: #a09a94;
    --info-bg: #eef4fb;
    --info: #1a4f8a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--red);
    color: white;
    padding: 20px 24px;
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 12px;
    transition: color 0.15s;
  }

  .back-link:hover { color: white; }

  header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 4px;
  }

  header h1 em { font-style: italic; }

  header p {
    font-size: 12px;
    opacity: 0.8;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .votes-banner {
    background: var(--info-bg);
    border: 1px solid #c8ddf5;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .votes-banner .left { font-size: 14px; color: var(--info); }
  .votes-banner .left strong { font-weight: 500; }

  .pips { display: flex; gap: 4px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: #c8ddf5; transition: background 0.2s; }
  .pip.used { background: var(--info); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }

  thead th {
    font-size: 10px;
    font-weight: 500;
    color: var(--hint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    background: #faf9f7;
  }

  thead th.r { text-align: right; }
  thead th.c { text-align: center; }
  thead th.count-cell { font-size: 10px; color: var(--hint); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf9f7; }

  td { padding: 12px 14px; vertical-align: middle; }

  .rank-cell {
    font-size: 14px;
    font-weight: 500;
    color: var(--hint);
    width: 32px;
    text-align: center;
  }

  .rank-cell.gold { color: var(--gold); }
  .rank-cell.silver { color: var(--silver); }
  .rank-cell.bronze { color: var(--bronze); }

  .rest-cell {
    overflow: hidden;
  }

  .rest-cell .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rest-cell .addr {
    font-size: 12px;
    color: var(--hint);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .count-cell {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    width: 70px;
  }

  .vote-cell { text-align: right; width: 72px; }

  .vctrl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .vbtn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    font-family: 'DM Sans', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .vbtn:hover:not(:disabled) {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
  }

  .vbtn:disabled { opacity: 0.35; cursor: not-allowed; }

  .vnum {
    font-size: 12px;
    font-weight: 500;
    min-width: 16px;
    text-align: center;
    color: var(--text);
  }

  .vnum.active { color: var(--red); }

  .voted-row td { background: #fefaf9; }

  .voted-badge {
    font-size: 11px;
    background: var(--red-light);
    color: var(--red);
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid #f0c8c4;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--hint);
  }

  .empty-state h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 8px;
    color: var(--muted);
  }

  .empty-state p { font-size: 13px; line-height: 1.6; }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--hint);
    margin-top: 20px;
  }

  .loading-row td {
    text-align: center;
    padding: 40px;
    color: var(--hint);
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: white;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 14px;
    transition: transform 0.3s ease;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .all-voted-note {
    background: #fdf8ee;
    border: 1px solid #f0dda0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #7a5c00;
    margin-bottom: 18px;
    display: none;
  }

  .all-voted-note.visible { display: block; }

  @media (max-width: 600px) {
    .pips { display: none; }

    header { padding: 16px; }

    td { padding: 10px 6px; }
    thead th { padding: 10px 6px; }

    .vbtn { width: 34px; height: 34px; font-size: 17px; }
    .vnum { font-size: 13px; min-width: 18px; }
    .vote-cell { width: auto; }

    .all-voted-note { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="back-link" href="index.html">← Back to all dishes</a>
    <h1 id="page-title">Loading…</h1>
    <p id="page-sub">Top 10 restaurants voted by the community</p>
  </div>
</header>

<div class="container">

  <div class="votes-banner">
    <div class="left">You have <strong id="votes-left">10</strong> votes left for this dish</div>
    <div class="pips" id="pips-container"></div>
  </div>

  <div class="all-voted-note" id="all-voted-note">
    You have used all your votes for this dish. Thank you for voting!
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Restaurant</th>
          <th class="r count-cell">Total Votes</th>
          <th class="r">Your vote</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="loading-row"><td colspan="3">Loading restaurants…</td></tr>
      </tbody>
    </table>
  </div>

  <p class="footer-note" id="footer-note"></p>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://xlbgijjtxbflhkjftene.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1tTdNWd1N0n9w3ElrCynNw_ia1JWbc6';

  const TOTAL_VOTES = 10;
  const BROWSER_ID_KEY = 'sg_food_browser_id';

  function votesKey(slug) { return 'sg_votes_rest_' + slug; }

  function getBrowserId() {
    let id = localStorage.getItem(BROWSER_ID_KEY);
    if (!id) {
      id = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(BROWSER_ID_KEY, id);
    }
    return id;
  }

  async function api(path, options = {}) {
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=minimal'
    };
    if (options.headers) Object.assign(headers, options.headers);
    const fetchOptions = { method: options.method || 'GET', headers };
    if (options.body) fetchOptions.body = options.body;
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, fetchOptions);
    if (!res.ok) {
      const errText = await res.text();
      console.error('Supabase error:', res.status, errText);
      throw new Error(errText);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  let slug = '';
  let categoryId = null;
  let restaurants = [];

  function getVotes() {
    try { return JSON.parse(localStorage.getItem(votesKey(slug)) || '{}'); }
    catch { return {}; }
  }

  function saveVotes(v) { localStorage.setItem(votesKey(slug), JSON.stringify(v)); }

  function votesUsed() { return Object.values(getVotes()).reduce((a, b) => a + b, 0); }
  function votesRemaining() { return TOTAL_VOTES - votesUsed(); }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    slug = params.get('slug');

    if (!slug) {
      document.getElementById('page-title').textContent = 'Dish not found';
      document.getElementById('table-body').innerHTML =
        '<tr class="loading-row"><td colspan="3">No dish specified.</td></tr>';
      return;
    }

    try {
      const cats = await api(`categories?slug=eq.${slug}&select=*`);
      if (!cats || cats.length === 0) {
        document.getElementById('page-title').textContent = 'Dish not found';
        return;
      }
      const cat = cats[0];
      categoryId = cat.id;
      document.title = cat.name + ' — Top 10 Singapore Food';
      document.getElementById('page-title').innerHTML = `Top 10 <em>${cat.name}</em>`;
      document.getElementById('page-sub').textContent =
        cat.description ? cat.description + ' · voted by the community' : 'Voted by the community';

      await loadRestaurants();
    } catch (e) {
      document.getElementById('page-title').textContent = 'Could not load';
      document.getElementById('table-body').innerHTML =
        '<tr class="loading-row"><td colspan="3">Error loading data. Check console.</td></tr>';
    }
  }

  async function loadRestaurants() {
    restaurants = await api(
      `restaurants?category_id=eq.${categoryId}&select=*&order=total_votes.desc`
    );
    renderTable();
  }

  function renderTable() {
    const votes = getVotes();
    const remaining = votesRemaining();
    const used = votesUsed();

    document.getElementById('votes-left').textContent = remaining;
    renderPips(used);
    document.getElementById('all-voted-note').classList.toggle('visible', remaining === 0);

    const tbody = document.getElementById('table-body');

    if (!restaurants.length) {
      tbody.innerHTML = `
        <tr><td colspan="3">
          <div class="empty-state">
            <h3>No restaurants yet</h3>
            <p>Add restaurants for this dish in your Supabase dashboard.<br>
            Go to Table Editor → restaurants → Insert row.</p>
          </div>
        </td></tr>`;
      document.getElementById('footer-note').textContent = '';
      return;
    }

    tbody.innerHTML = restaurants.map((r) => {
      const myVotes = votes[r.id] || 0;
      const isVoted = myVotes > 0;
      const minusDisabled = myVotes <= 0;
      const plusDisabled = remaining <= 0;

      return `<tr class="${isVoted ? 'voted-row' : ''}" id="row-${r.id}">
        <td class="rest-cell">
          <div class="name">${r.name}</div>
          ${r.address ? `<div class="addr">${r.address}</div>` : ''}
        </td>
        <td class="count-cell">${(r.total_votes || 0).toLocaleString()}</td>
        <td class="vote-cell">
          <div class="vctrl">
            <button class="vbtn" onclick="changeVote(${r.id}, -1)" ${minusDisabled ? 'disabled' : ''}>−</button>
            <span class="vnum ${myVotes > 0 ? 'active' : ''}" id="vnum-${r.id}">${myVotes}</span>
            <button class="vbtn" onclick="changeVote(${r.id}, 1)" ${plusDisabled ? 'disabled' : ''}>+</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('footer-note').textContent =
      `${restaurants.length} restaurant${restaurants.length !== 1 ? 's' : ''} · sorted by community votes`;
  }

  function renderPips(used) {
    const container = document.getElementById('pips-container');
    container.innerHTML = Array.from({ length: TOTAL_VOTES }, (_, i) =>
      `<div class="pip ${i < used ? 'used' : ''}"></div>`
    ).join('');
  }

  async function changeVote(restId, delta) {
    const votes = getVotes();
    const current = votes[restId] || 0;

    if (delta < 0 && current <= 0) return;
    if (delta > 0 && votesRemaining() <= 0) return;

    const newVal = current + delta;
    if (newVal <= 0) delete votes[restId];
    else votes[restId] = newVal;

    saveVotes(votes);

    const rest = restaurants.find(r => r.id === restId);
    if (rest) {
      rest.total_votes = (rest.total_votes || 0) + delta;
      restaurants.sort((a, b) => b.total_votes - a.total_votes);
    }

    renderTable();

    const browserId = getBrowserId();
    try {
      if (rest) {
        await api(`restaurants?id=eq.${restId}`, {
          method: 'PATCH',
          body: JSON.stringify({ total_votes: rest.total_votes }),
        });
      }
      if (newVal <= 0) {
        await api(`votes?browser_id=eq.${browserId}&target_type=eq.restaurant&target_id=eq.${restId}`, {
          method: 'DELETE',
        });
      } else {
        await api('votes', {
          method: 'POST',
          prefer: 'resolution=merge-duplicates',
          body: JSON.stringify({
            browser_id: browserId,
            target_type: 'restaurant',
            target_id: restId,
            votes_given: newVal,
          }),
        });
      }
    } catch (e) {
      showToast('Error saving vote. Please try again.');
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  init();
</script>
</body>
</html>
