<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Singapore Food — Voted by Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C0392B;
    --red-light: #fdf0ef;
    --gold: #B8860B;
    --silver: #7a7a7a;
    --bronze: #8B4513;
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4de;
    --text: #1a1a1a;
    --muted: #6b6660;
    --hint: #a09a94;
    --info-bg: #eef4fb;
    --info: #1a4f8a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--red);
    color: white;
    padding: 28px 24px 24px;
    text-align: center;
  }

  header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(12px, 4vw, 26px);
    white-space: nowrap;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  header p {
    font-size: 12px;
    opacity: 0.85;
    max-width: 480px;
    margin: 0 auto;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .votes-banner {
    background: var(--info-bg);
    border: 1px solid #c8ddf5;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .votes-banner .left {
    font-size: 14px;
    color: var(--info);
  }

  .votes-banner .left strong { font-weight: 500; }

  .votes-banner .pips {
    display: flex;
    gap: 4px;
  }

  .pip {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #c8ddf5;
    transition: background 0.2s;
  }

  .pip.used { background: var(--info); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead th {
    font-size: 10px;
    font-weight: 500;
    color: var(--hint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    background: #faf9f7;
  }

  thead th.r { text-align: right; }
  thead th.c { text-align: center; }
  thead th.count-cell { font-size: 10px; color: var(--hint); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf9f7; }

  td {
    padding: 11px 14px;
    vertical-align: middle;
  }

  .rank-cell {
    font-size: 14px;
    font-weight: 500;
    color: var(--hint);
    width: 32px;
    text-align: center;
  }

  .rank-cell.gold { color: var(--gold); }
  .rank-cell.silver { color: var(--silver); }
  .rank-cell.bronze { color: var(--bronze); }

  .dish-cell {
    overflow: hidden;
  }

  .dish-cell .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .count-cell {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    width: 70px;
  }

  .vote-cell {
    text-align: right;
    width: 72px;
  }

  .vctrl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .vbtn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    font-family: 'DM Sans', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .vbtn:hover:not(:disabled) {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
  }

  .vbtn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .vnum {
    font-size: 12px;
    font-weight: 500;
    min-width: 16px;
    text-align: center;
    color: var(--text);
  }

  .vnum.active { color: var(--red); }

  .dish-link {
    color: inherit;
    text-decoration: none;
  }

  .dish-link:hover .name { color: var(--red); }

  .voted-row td { background: #fefaf9; }
  .voted-badge {
    font-size: 11px;
    background: var(--red-light);
    color: var(--red);
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid #f0c8c4;
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--hint);
    margin-top: 20px;
  }

  .loading-row td {
    text-align: center;
    padding: 40px;
    color: var(--hint);
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: white;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 14px;
    transition: transform 0.3s ease;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .votes-banner .pips { display: none; }

    header { padding: 20px 16px 18px; }

    td { padding: 10px 6px; }
    thead th { padding: 10px 6px; }

    .vbtn { width: 34px; height: 34px; font-size: 17px; }
    .vnum { font-size: 13px; min-width: 18px; }
    .vote-cell { width: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Top 10 Singapore Food Voted by Community</h1>
  <p>Vote for your favourite dishes!<br>You can give all your votes to 1 dish, or 10 different dishes!<br>Click on the dish to vote for restaurants!</p>
</header>

<div class="container">

  <div class="votes-banner">
    <div class="left">You have <strong id="votes-left">10</strong> votes left for dish categories</div>
    <div class="pips" id="pips-container"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Dish</th>
          <th class="r count-cell">Total Votes</th>
          <th class="r">Your vote</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="loading-row"><td colspan="3">Loading dishes…</td></tr>
      </tbody>
    </table>
  </div>

  <p class="footer-note" id="footer-note"></p>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://xlbgijjtxbflhkjftene.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1tTdNWd1N0n9w3ElrCynNw_ia1JWbc6';

  const TOTAL_VOTES = 10;
  const VOTES_KEY = 'sg_food_votes_category';
  const BROWSER_ID_KEY = 'sg_food_browser_id';

  function getBrowserId() {
    let id = localStorage.getItem(BROWSER_ID_KEY);
    if (!id) {
      id = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(BROWSER_ID_KEY, id);
    }
    return id;
  }

  async function api(path, options = {}) {
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=minimal'
    };
    if (options.headers) Object.assign(headers, options.headers);
    const fetchOptions = { method: options.method || 'GET', headers };
    if (options.body) fetchOptions.body = options.body;
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, fetchOptions);
    if (!res.ok) {
      const errText = await res.text();
      console.error('Supabase error:', res.status, errText);
      throw new Error(errText);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  function getVotes() {
    try { return JSON.parse(localStorage.getItem(VOTES_KEY) || '{}'); }
    catch { return {}; }
  }

  function saveVotes(v) { localStorage.setItem(VOTES_KEY, JSON.stringify(v)); }

  function votesUsed() { return Object.values(getVotes()).reduce((a, b) => a + b, 0); }
  function votesRemaining() { return TOTAL_VOTES - votesUsed(); }

  let categories = [];

  async function loadCategories() {
    try {
      categories = await api('dishes?select=*&order=total_votes.desc', {
        headers: { 'Prefer': 'return=representation' }
      });
      renderTable();
    } catch (e) {
      document.getElementById('table-body').innerHTML =
        '<tr class="loading-row"><td colspan="3">Could not load data. Check your Supabase URL and key.</td></tr>';
    }
  }

  function renderTable() {
    const votes = getVotes();
    const remaining = votesRemaining();
    const used = votesUsed();

    document.getElementById('votes-left').textContent = remaining;
    renderPips(used);

    const tbody = document.getElementById('table-body');
    if (!categories.length) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="3">No dishes found.</td></tr>';
      return;
    }

    tbody.innerHTML = categories.map((cat) => {
      const myVotes = votes[cat.id] || 0;
      const isVoted = myVotes > 0;
      const minusDisabled = myVotes <= 0;
      const plusDisabled = remaining <= 0;

      return `<tr class="${isVoted ? 'voted-row' : ''}" id="row-${cat.id}">
        <td class="dish-cell">
          <a class="dish-link" href="category.html?slug=${cat.slug}">
            <div class="name">${cat.name}</div>
          </a>
        </td>
        <td class="count-cell">${(cat.total_votes || 0).toLocaleString()}</td>
        <td class="vote-cell">
          <div class="vctrl">
            <button class="vbtn" onclick="changeVote(${cat.id}, -1)" ${minusDisabled ? 'disabled' : ''} title="Remove vote">−</button>
            <span class="vnum ${myVotes > 0 ? 'active' : ''}" id="vnum-${cat.id}">${myVotes}</span>
            <button class="vbtn" onclick="changeVote(${cat.id}, 1)" ${plusDisabled ? 'disabled' : ''} title="Add vote">+</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('footer-note').textContent =
      `${categories.length} dishes · sorted by community votes`;
  }

  function renderPips(used) {
    const container = document.getElementById('pips-container');
    container.innerHTML = Array.from({ length: TOTAL_VOTES }, (_, i) =>
      `<div class="pip ${i < used ? 'used' : ''}"></div>`
    ).join('');
  }

  async function changeVote(catId, delta) {
    const votes = getVotes();
    const current = votes[catId] || 0;

    if (delta < 0 && current <= 0) return;
    if (delta > 0 && votesRemaining() <= 0) return;

    const newVal = current + delta;
    if (newVal <= 0) delete votes[catId];
    else votes[catId] = newVal;

    saveVotes(votes);

    const cat = categories.find(c => c.id === catId);
    if (cat) {
      cat.total_votes = (cat.total_votes || 0) + delta;
      categories.sort((a, b) => b.total_votes - a.total_votes);
    }

    renderTable();

    const browserId = getBrowserId();
    try {
      if (cat) {
        await api(`dishes?id=eq.${catId}`, {
          method: 'PATCH',
          body: JSON.stringify({ total_votes: cat.total_votes }),
        });
      }
      if (newVal <= 0) {
        await api(`votes?browser_id=eq.${browserId}&target_type=eq.dish&target_id=eq.${catId}`, {
          method: 'DELETE',
        });
      } else {
        await api('votes', {
          method: 'POST',
          prefer: 'resolution=merge-duplicates',
          body: JSON.stringify({
            browser_id: browserId,
            target_type: 'dish',
            target_id: catId,
            votes_given: newVal,
          }),
        });
      }
    } catch (e) {
      showToast('Error saving vote. Please try again.');
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  loadCategories();
</script>
</body>
</html>
