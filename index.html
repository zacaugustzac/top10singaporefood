<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Singapore Food — Voted by Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C0392B;
    --red-light: #fdf0ef;
    --gold: #B8860B;
    --silver: #7a7a7a;
    --bronze: #8B4513;
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4de;
    --text: #1a1a1a;
    --muted: #6b6660;
    --hint: #a09a94;
    --info-bg: #eef4fb;
    --info: #1a4f8a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--red);
    color: white;
    padding: 0 24px;
  }

  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 56px;
  }

  header h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(14px, 3.2vw, 20px);
    font-weight: 500;
    white-space: nowrap;
    letter-spacing: -0.01em;
    line-height: 1;
  }


  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 90px;
  }

  .votes-bubble {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--info);
    color: white;
    padding: 10px 10px 10px 20px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 16px rgba(26,79,138,0.35);
    z-index: 90;
    white-space: nowrap;
    transition: opacity 0.3s;
  }

  .votes-bubble .pips {
    display: flex;
    gap: 3px;
  }

  .pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.2s;
  }

  .pip.used { background: white; }

  .submit-btn {
    background: white;
    color: var(--info);
    border: none;
    padding: 6px 16px;
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    touch-action: manipulation;
  }

  .submit-btn:hover:not(:disabled) { background: #e8f0fe; }
  .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .signin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }

  .signin-overlay.hidden { display: none; }

  .signin-modal {
    background: white;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--hint);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover { color: var(--text); }

  .signin-modal h3 {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }

  .signin-modal p {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .signin-modal .google-btn {
    width: 100%;
    justify-content: center;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
  }


  @media (max-width: 600px) {
    .votes-bubble { font-size: 13px; padding: 8px 8px 8px 16px; bottom: 16px; }
    .votes-bubble .pips { display: none; }
    .submit-btn { padding: 6px 14px; font-size: 12px; }
  }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead th {
    font-size: 10px;
    font-weight: 500;
    color: var(--hint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    background: #faf9f7;
  }

  thead th.r { text-align: right; }
  thead th.c { text-align: center; }
  thead th.count-cell { font-size: 10px; color: var(--hint); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf9f7; }

  td {
    padding: 11px 14px;
    vertical-align: middle;
  }

  .rank-cell {
    font-size: 14px;
    font-weight: 500;
    color: var(--hint);
    width: 32px;
    text-align: center;
  }

  .rank-cell.gold { color: var(--gold); }
  .rank-cell.silver { color: var(--silver); }
  .rank-cell.bronze { color: var(--bronze); }

  .dish-cell {
    overflow: hidden;
  }

  .dish-cell .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .count-cell {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    width: 70px;
  }

  .vote-cell {
    text-align: right;
    width: 72px;
  }

  .vctrl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .vbtn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    font-family: 'DM Sans', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .vbtn:hover:not(:disabled) {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
  }

  .vbtn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .vnum {
    font-size: 12px;
    font-weight: 500;
    min-width: 16px;
    text-align: center;
    color: var(--text);
  }

  .vnum.active { color: var(--red); }

  .dish-link {
    color: inherit;
    text-decoration: none;
  }

  .dish-link .name {
    text-decoration: underline;
    text-decoration-color: rgba(26,26,26,0.3);
    text-underline-offset: 2px;
  }

  .dish-link:hover .name {
    color: var(--red);
    text-decoration-color: var(--red);
  }

  .voted-row td { background: #fefaf9; }
  .voted-badge {
    font-size: 11px;
    background: var(--red-light);
    color: var(--red);
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid #f0c8c4;
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--hint);
    margin-top: 20px;
  }

  .loading-row td {
    text-align: center;
    padding: 40px;
    color: var(--hint);
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: white;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 14px;
    transition: transform 0.3s ease;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .auth-bar { display: flex; align-items: center; flex-shrink: 0; }

  .google-btn {
    background: white;
    color: #3c4043;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
  }

  .google-btn:hover { background: #f1f3f4; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

  .auth-user {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(255,255,255,0.9);
  }

  .signout-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 4px 12px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
    touch-action: manipulation;
  }

  .signout-btn:hover { background: rgba(255,255,255,0.3); }

  @media (max-width: 600px) {
    .votes-banner .pips { display: none; }

    header { padding: 0 16px; }
    .header-inner { min-height: 50px; gap: 10px; }
    header h1 { font-size: clamp(12px, 3.5vw, 16px); }
    .google-btn span { display: none; }
    .tip-banner { padding: 10px 16px; }

    td { padding: 10px 6px; }
    thead th { padding: 10px 6px; }

    .vbtn { width: 34px; height: 34px; font-size: 17px; }
    .vnum { font-size: 13px; min-width: 18px; }
    .vote-cell { width: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Top 10 Singapore Food Voted by Community</h1>
    <div class="auth-bar" id="auth-bar">
      <button class="google-btn" onclick="signIn()">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span>Sign in to vote</span>
      </button>
    </div>
  </div>
</header>

<div class="container">

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Dish</th>
          <th class="r count-cell">Total Votes</th>
          <th class="r">Your vote</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="loading-row"><td colspan="3">Loading dishes…</td></tr>
      </tbody>
    </table>
  </div>

  <p class="footer-note" id="footer-note"></p>
</div>

<div class="votes-bubble" id="votes-bubble">
  <span>You have <strong id="votes-left">10</strong> votes left</span>
  <div class="pips" id="pips-container"></div>
  <button class="submit-btn" id="submit-btn" onclick="submitVotes()" disabled>Submit</button>
</div>

<div class="signin-overlay hidden" id="signin-overlay">
  <div class="signin-modal">
    <button class="modal-close" onclick="document.getElementById('signin-overlay').classList.add('hidden')" title="Close">×</button>
    <h3>Sign in to submit</h3>
    <p>Sign in with Google to save your votes.</p>
    <button class="google-btn" onclick="signInAndSubmit()">
      <svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://xlbgijjtxbflhkjftene.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1tTdNWd1N0n9w3ElrCynNw_ia1JWbc6';
  const TOTAL_VOTES = 10;

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let categories = [];
  let myVotes = {};      // pending (unsaved) votes
  let savedVotes = {};   // last known DB state
  let authInitialized = false; // prevents double-fire race condition

  // ── auth ──
  sb.auth.onAuthStateChange(async (event, session) => {
    currentUser = session?.user || null;
    if (window.location.hash) history.replaceState(null, '', window.location.pathname);
    renderAuthBar();

    if (currentUser) {
      const pending = sessionStorage.getItem('pendingVotes');
      if (pending) {
        // Claim the slot synchronously before first await so a concurrent second
        // auth event (Supabase fires both INITIAL_SESSION and SIGNED_IN) cannot
        // race in and overwrite myVotes with a mid-commit DB snapshot.
        authInitialized = true;
        sessionStorage.removeItem('pendingVotes');
        myVotes = JSON.parse(pending);
        savedVotes = await fetchSavedVotes();
        document.getElementById('signin-overlay').classList.add('hidden');
        await commitVotes();
      } else if (!authInitialized) {
        authInitialized = true;
        savedVotes = await fetchSavedVotes();
        myVotes = { ...savedVotes };
      }
    } else {
      authInitialized = false;
      savedVotes = {};
      myVotes = {};
    }
    if (categories.length) renderTable();
  });

  function renderAuthBar() {
    const bar = document.getElementById('auth-bar');
    if (currentUser) {
      const name = currentUser.user_metadata?.full_name || currentUser.email;
      bar.innerHTML = `<div class="auth-user"><span>${name}</span><button class="signout-btn" onclick="signOut()">Sign out</button></div>`;
    } else {
      bar.innerHTML = `<button class="google-btn" onclick="signIn()"><svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span>Sign in to vote</span></button>`;
    }
  }

  async function signIn() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname, scopes: 'email' }
    });
    if (error) showToast('Sign in failed: ' + error.message);
  }

  async function signInAndSubmit() {
    sessionStorage.setItem('pendingVotes', JSON.stringify(myVotes));
    await signIn();
  }

  function signOut() {
    myVotes = {};
    savedVotes = {};
    authInitialized = false;
    currentUser = null;
    // Clear session from localStorage synchronously so the UI never hangs,
    // then fire-and-forget the Supabase client call to clean up its internal state.
    try { localStorage.removeItem('sb-xlbgijjtxbflhkjftene-auth-token'); } catch {}
    sb.auth.signOut({ scope: 'local' }).catch(() => {});
    renderAuthBar();
    renderTable();
  }

  // Read the stored JWT directly from localStorage — synchronous, never blocks
  // on a token refresh the way sb.from(...) queries can.
  function getAuthToken() {
    try {
      const stored = localStorage.getItem('sb-xlbgijjtxbflhkjftene-auth-token');
      return stored ? JSON.parse(stored)?.access_token ?? null : null;
    } catch { return null; }
  }

  function authHeaders() {
    const token = getAuthToken();
    return token ? { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' } : null;
  }

  async function fetchSavedVotes() {
    const headers = authHeaders();
    if (!headers) return {};
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/votes?select=target_id,votes_given&browser_id=eq.${currentUser.id}&target_type=eq.dish&order=id.desc`,
        { headers }
      );
      if (!res.ok) return {};
      const data = await res.json();
      const map = {};
      data.forEach(r => { if (!(r.target_id in map)) map[r.target_id] = r.votes_given; });
      return map;
    } catch { return {}; }
  }

  function votesUsed() { return Object.values(myVotes).reduce((a, b) => a + b, 0); }
  function votesRemaining() { return TOTAL_VOTES - votesUsed(); }

  // ── data ──
  async function loadCategories() {
    try {
      // Use plain fetch with the anon key so this query is never blocked by
      // the auth client refreshing an expired JWT on the same Supabase instance.
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/dishes?select=*&order=total_votes.desc.nullslast`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      if (!res.ok) throw new Error(res.status);
      categories = await res.json();
    } catch {
      document.getElementById('table-body').innerHTML = '<tr class="loading-row"><td colspan="3">Could not load data.</td></tr>';
      return;
    }
    renderTable();
  }

  function renderTable() {
    const remaining = votesRemaining();
    const used = votesUsed();
    document.getElementById('votes-left').textContent = remaining;
    renderPips(used);
    const btn = document.getElementById('submit-btn');
    btn.disabled = used === 0;
    btn.textContent = used > 0 ? `Submit (${used})` : 'Submit';

    const tbody = document.getElementById('table-body');
    if (!categories.length) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="3">No dishes found.</td></tr>';
      return;
    }

    tbody.innerHTML = categories.map((cat) => {
      const myV = myVotes[cat.id] || 0;
      const isVoted = myV > 0;
      const minusDisabled = myV <= 0;
      const plusDisabled = remaining <= 0;

      return `<tr class="${isVoted ? 'voted-row' : ''}" id="row-${cat.id}">
        <td class="dish-cell">
          <a class="dish-link" href="dish.html?slug=${cat.slug}">
            <div class="name">${cat.name}</div>
          </a>
        </td>
        <td class="count-cell">${(cat.total_votes || 0).toLocaleString()}</td>
        <td class="vote-cell">
          <div class="vctrl">
            <button class="vbtn" onclick="changeVote(${cat.id}, -1)" ${minusDisabled ? 'disabled' : ''}>−</button>
            <span class="vnum ${myV > 0 ? 'active' : ''}" id="vnum-${cat.id}">${myV}</span>
            <button class="vbtn" onclick="changeVote(${cat.id}, 1)" ${plusDisabled ? 'disabled' : ''}>+</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('footer-note').textContent = `${categories.length} dishes · sorted by community votes`;
  }

  function renderPips(used) {
    const container = document.getElementById('pips-container');
    container.innerHTML = Array.from({ length: TOTAL_VOTES }, (_, i) =>
      `<div class="pip ${i < used ? 'used' : ''}"></div>`
    ).join('');
  }

  function changeVote(catId, delta) {
    const current = myVotes[catId] || 0;
    if (delta < 0 && current <= 0) return;
    if (delta > 0 && votesRemaining() <= 0) return;
    const newVal = current + delta;
    if (newVal <= 0) delete myVotes[catId];
    else myVotes[catId] = newVal;
    renderTable();
  }

  async function submitVotes() {
    if (!currentUser) {
      document.getElementById('signin-overlay').classList.remove('hidden');
      return;
    }
    await commitVotes();
  }

  async function commitVotes() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const headers = authHeaders();
      if (!headers) throw new Error('not authenticated');
      const allIds = new Set([...Object.keys(myVotes), ...Object.keys(savedVotes)].map(Number));
      for (const catId of allIds) {
        const newVal = myVotes[catId] || 0;
        const oldVal = savedVotes[catId] || 0;
        const delta = newVal - oldVal;
        if (delta === 0) continue;

        const cat = categories.find(c => c.id === catId);
        if (cat) {
          cat.total_votes = (cat.total_votes || 0) + delta;
          const r = await fetch(`${SUPABASE_URL}/rest/v1/dishes?id=eq.${catId}`,
            { method: 'PATCH', headers: { ...headers, Prefer: 'return=minimal' }, body: JSON.stringify({ total_votes: cat.total_votes }) });
          if (!r.ok) throw new Error('dishes update failed');
        }
        // delete existing row then insert fresh (avoids needing a unique constraint)
        const del = await fetch(
          `${SUPABASE_URL}/rest/v1/votes?browser_id=eq.${currentUser.id}&target_type=eq.dish&target_id=eq.${catId}`,
          { method: 'DELETE', headers });
        if (!del.ok) throw new Error('votes delete failed');
        if (newVal > 0) {
          const ins = await fetch(`${SUPABASE_URL}/rest/v1/votes`,
            { method: 'POST', headers: { ...headers, Prefer: 'return=minimal' }, body: JSON.stringify({ browser_id: currentUser.id, target_type: 'dish', target_id: catId, votes_given: newVal }) });
          if (!ins.ok) throw new Error('votes insert failed');
        }
      }
      savedVotes = { ...myVotes };
      categories.sort((a, b) => b.total_votes - a.total_votes);
      showToast('Votes saved!');
    } catch (e) {
      showToast('Error saving votes. Please try again.');
    }
    renderTable();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  renderAuthBar();
  loadCategories();
</script>
</body>
</html>
